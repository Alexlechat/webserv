http {

	access_log	logs/access.log;

	server {
		listen 8080;
		server_name localhost;
		client_max_body_size 0;

		location / {
			root www/html;
			index index.html;
			methods GET;
			autoindex on;
			error_page 404 errors/404.html;
			error_page 500 errors/500.html;
		}

		location /upload {
			methods POST DELETE;
			upload_store www/uploads;
			upload_return /;
		}

		location /cgi-bin {
			methods GET POST;
			root www/cgi-bin;
			# Several CGI types on one and the same route: the interpreter
			# is chosen from the file extension.
			cgi_extension .py /usr/bin/python3;
			cgi_extension .sh /bin/bash;
			# Uncomment on a machine where php-cgi is installed:
			# cgi_extension .php /usr/bin/php-cgi;
		}

		location /old {
			redirect 301 /new;
		}
	}

	server {
		listen 9090;
		server_name other;

		location / {
			root www/other;
			index index.html;
			methods GET;
			autoindex on;
		}
	}

}
