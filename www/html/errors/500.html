<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>500 Internal Server Error</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background:#0f1117; color:#e2e8f0;
                display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
        .box { text-align:center; }
        .code { font-size: 6rem; font-weight: 700; color: #f6ad55; line-height:1; }
        h1 { color: #a0aec0; font-weight: 400; margin: 8px 0 24px; }
        p  { color: #4a5568; margin-bottom: 24px; }
        a  { color:#63b3ed; text-decoration:none; border:1px solid #2b4c7e;
                padding:8px 20px; border-radius:6px; }
    </style>
</head>
<body>
<div class="box">
    <div class="code">500</div>
    <h1>Internal Server Error</h1>
    <p>Something went wrong on the server side.</p>
    <a href="/">Go Home</a>
</div>
</body>
</html>
