http {
    server {
        listen 8080;
        server_name site-a.local;
        error_page 404 errors/404.html;

		location / {
			root www/site_a;
			methods GET;
			autoindex on;
		}
    }

    server {
        listen 8080;
        server_name site-b.local;

		location / {
			root www/site_b;
			methods GET;
		}
    }
}
